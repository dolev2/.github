name: משימה
description: משימה חדשה לצינור
title: ""
labels: ["task", "owner:claude", "status:explore"]
body:
  - type: textarea
    id: goal
    attributes:
      label: מה רוצים
      description: מה צריך לקרות ולמה. אין צורך בתוכנית — Claude יכתוב אותה.
      placeholder: תיאור חופשי.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: הקשר / קישורים
      description: קישורים לקבצים, מסמכי אסטרטגיה, issues קשורים.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        להלן הסעיף שבו Claude מתחזק את התוכנית. **אל תמחק אותו** — הוא מתעדכן במקום, עם הערה מה השתנה ולמה.

  - type: textarea
    id: plan
    attributes:
      label: Plan
      description: נכתב ומתוחזק ע"י Claude. לא למלא ידנית.
      value: |
        _טרם נכתבה תוכנית._
    validations:
      required: false

  - type: textarea
    id: open_questions
    attributes:
      label: שאלות פתוחות
      description: >
        נכתב ומתוחזק ע"י Claude. כל שאלה היא תיבת סימון; שאלה שנענתה מסומנת
        ולא נמחקת, עם ההחלטה לצידה. מעבר ל-status:done עם תיבה לא מסומנת מפעיל אזהרה.
      value: |
        _אין שאלות פתוחות._
    validations:
      required: false
